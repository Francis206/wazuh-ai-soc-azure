# LoRA/QLoRA fine-tuning config for the Tier 1-3 SOC assistant.
# Consumed by src/llm/finetune/train.py; also read by
# .github/workflows/ml-training.yml when submitting the Azure ML job.

base_model_id: mistralai/Mistral-7B-Instruct-v0.2
output_dir: ./ml/models/soc-lora-adapter

dataset:
  train_path: ./ml/data/soc_incidents_train.jsonl
  eval_path: ./ml/data/soc_incidents_eval.jsonl
  prompt_field: prompt
  completion_field: completion

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

training:
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 10
  eval_strategy: epoch
  save_strategy: epoch
  bf16: true

azure_ml:
  compute_target: gpu-cluster
  environment_name: soc-llm-finetune-env
  experiment_name: soc-tier1-3-finetune
